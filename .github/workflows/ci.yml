---
name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

## Concurrency only allowed in the main branch.
## So old builds running for old commits within the same Pull Request are cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Lint
        run: uv run poe lint

  build:
    needs:
      - lint
    strategy:
      matrix:
        os:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Build
        run: uv run poe build

      - uses: actions/upload-artifact@v7
        with:
          name: temply-bundle-${{ matrix.os.target }}
          path: dist/temply/

      - uses: actions/upload-artifact@v7
        with:
          name: temply-tarball-${{ matrix.os.target }}
          path: dist/*.tar.gz

  test:
    needs:
      - build
    strategy:
      matrix:
        os:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Test
        run: uv run poe test

  package-deb:
    needs:
      - test
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - uses: actions/download-artifact@v8
        with:
          name: temply-bundle-${{ matrix.os.target }}
          path: dist/temply

      - name: Build deb packages
        run: uv run poe package:deb

      - uses: actions/upload-artifact@v7
        with:
          name: temply-package-deb-${{ matrix.os.target }}
          path: dist/*.deb

  package-rpm:
    needs:
      - test
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - uses: actions/download-artifact@v8
        with:
          name: temply-bundle-${{ matrix.os.target }}
          path: dist/temply

      - name: Build rpm packages
        run: uv run poe package:rpm

      - uses: actions/upload-artifact@v7
        with:
          name: temply-package-rpm-${{ matrix.os.target }}
          path: dist/*.rpm

  sanitize-deb:
    needs:
      - package-deb
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: temply-package-deb-${{ matrix.os.target }}
          path: dist

      - name: Verify deb install
        run: |
          sudo dpkg -i dist/temply*.deb
          sudo apt-get install -qyf
          temply --version

  sanitize-tarball:
    needs:
      - test
    strategy:
      matrix:
        os:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: temply-tarball-${{ matrix.os.target }}
          path: dist

      - name: Verify tarball install
        run: |
          mkdir -p ~/.local/bin ~/.local/opt/temply
          tar -C ~/.local/opt/temply -xzf dist/temply-*-${{ matrix.os.target }}.tar.gz
          ln -sf ~/.local/opt/temply/temply ~/.local/bin/temply
          ~/.local/bin/temply --version
