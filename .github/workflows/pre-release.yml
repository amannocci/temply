---
name: Pre release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (e.g. 1.2.3). This workflow will automatically perform the required version bumps"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  pre-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate inputs
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases must be prepared from the main branch, got ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup github actions bot
        uses: techcode-io/github-actions/setup-github-bot@setup-github-bot/v1

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Run pre-release step
        run: uv run poe release:pre
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
