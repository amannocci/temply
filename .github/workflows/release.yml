---
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The next iteration version. This workflow will automatically perform the required version bumps"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        env:
          NEXT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases must be created from the main branch, got ${GITHUB_REF}"
            exit 1
          fi
          if [[ ! "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]; then
            echo "::error::The next iteration version must match 1.2.3-dev, got ${NEXT_VERSION}"
            exit 1
          fi

  ci:
    needs:
      - validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    runs-on: ubuntu-24.04
    needs:
      - ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: temply-tarball-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: temply-package-*
          merge-multiple: true
          path: dist

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run poe release

  post-release:
    needs:
      - release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup github actions bot
        uses: ./.github/workflows/setup-github-bot

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Run post-release step
        run: uv run poe release:post
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ inputs.version }}
